{{define "content"}}
<header class="page-header">
  <h2>原始 JSON</h2>
  <a href="/admin/" class="btn">返回概览</a>
</header>
{{if .Error}}<div class="error">{{.Error}}</div>{{end}}
<form method="POST" action="/admin/raw" class="form" style="max-width: 980px">
  <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
  <div class="field">
    <label>完整配置</label>
    <textarea name="config" rows="28" required>{{.Config}}</textarea>
    <small>保存后会先校验并更新运行时配置，再原子写回配置文件。</small>
  </div>
  <div class="actions">
    <button type="submit" class="btn primary">保存</button>
    <a href="/admin/" class="btn">取消</a>
  </div>
</form>
{{end}}
